name: Build DropIt Multi-Platform Executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DropIt-Windows
            executable_name: DropIt.exe
          - os: macos-latest
            artifact_name: DropIt-macOS
            executable_name: DropIt-macOS.app
          - os: ubuntu-latest
            artifact_name: DropIt-Linux
            executable_name: DropIt-Linux

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Build Executable with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        flet pack main.py --icon=assets/logo.ico --add-data "assets;assets" --name DropIt

    - name: Build Executable with PyInstaller (macOS / Linux)
      if: runner.os != 'Windows'
      run: |
        flet pack main.py --add-data "assets:assets" --name ${{ matrix.artifact_name }}

    - name: Zip Executables
      run: |
        cd dist
        python -m zipfile -c ${{ matrix.artifact_name }}.zip ${{ matrix.executable_name }}

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.artifact_name }}.zip

    - name: Upload Release Asset to GitHub Release
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} dist/${{ matrix.artifact_name }}.zip --clobber

